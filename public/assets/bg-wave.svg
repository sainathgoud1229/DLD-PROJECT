<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#4ab3ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.4" />
    </linearGradient>
    <style>
      .wave { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>
  <path fill="url(#grad)" class="wave" d="M0,160 C360,200 1080,120 1440,160 L1440,320 L0,320 Z"></path>
</svg>

